# ---------------------------------------------------------------------------
# Deploy Royal-Sailing to Fly.io
# ---------------------------------------------------------------------------
name: Deploy to Fly

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - ".gitignore"
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy to Fly.io
        run: flyctl deploy --remote-only -c fly.toml
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Health verification
        run: |
          sleep 10
          curl -sf --retry 3 --retry-delay 5 https://royal-sailing.fly.dev/health || {
            echo "Health check failed for royal-sailing"
            exit 1
          }